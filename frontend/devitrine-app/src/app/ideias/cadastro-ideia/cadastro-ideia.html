<app-header titulo="Ideias"></app-header>
<main class="content">
    <div class="card card-post">
        <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="form">
            <div class="form-group">
                <label for="titulo">Título: *</label>
                <input formControlName="titulo" type="text" name="titulo" id="titulo" placeholder="Digite o título da ideia">

                @if (form.controls.titulo.hasError('required') && form.controls.titulo.touched) {
                    <span class="form-hint form-hint-error">
                        O título da ideia é obrigatório.
                    </span>
                }
            </div>

            <div class="form-group">
                <label for="descricao">Descrição: *</label>
                <textarea formControlName="descricao" name="descricao" id="descricao" placeholder="Descreva a ideia e como outros desenvolvedores podem colaborar"></textarea>

                @if (form.controls.descricao.hasError('required') && form.controls.descricao.touched) {
                    <span class="form-hint form-hint-error">
                        A descrição da ideia é obrigatória.
                    </span>
                }
            </div>

            <div class="form-actions">
                <button type="submit" class="secundary-btn comment">Compartilhar</button>
                <button type="button" class="secundary-btn comment" [routerLink]="['/paginas/listagem-ideias']">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</main>
