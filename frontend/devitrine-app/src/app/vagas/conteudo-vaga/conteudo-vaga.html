<main class="content">
    <button type="button" class="back-btn" onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i> Voltar para vagas
    </button>

    <div class="card-full">
        @if (vaga$ | async; as vaga) {
            <div class="article-header">
                <span class="badge-type">
                    <i class="fa-solid fa-briefcase"></i> Vaga Aberta
                </span>
                <h2>{{ vaga.titulo }}</h2>
                <div class="meta-row">
                    <span><i class="fa-regular fa-building"></i> Publicado por: <strong>{{ vaga.autorNome }}</strong></span>
                    <span><i class="fa-regular fa-clock"></i> {{ vaga.dataPostagem | date:'dd/MM/yyyy HH:mm' }}</span>
                </div>
            </div>

            <div class="section-box">
                <div class="section-label"><i class="fa-solid fa-align-left"></i> Descrição da Oportunidade</div>
                <div class="section-text">{{ vaga.conteudo }}</div>
            </div>

            <div class="section-box">
                <div class="section-label"><i class="fa-solid fa-list-check"></i> Requisitos Desejados</div>
                <div class="section-text">{{ vaga.requisitos }}</div>
            </div>

            @if (auth.podeCandidatar) {
                <div style="margin-top: 24px;">
                    <button class="primary-btn"
                            (click)="candidatar()"
                            [disabled]="enviando || candidatou">
                        <i class="fa-solid fa-paper-plane"></i>
                        {{ candidatou ? 'Candidatura enviada com sucesso' : 'Candidatar-se a esta vaga' }}
                    </button>
                </div>
            }
        }
    </div>
</main>
